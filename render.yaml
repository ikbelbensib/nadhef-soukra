# Blueprint Render — runtime Node natif, pas Docker.
#
# Le Dockerfile du dépôt ne fait rien de plus que `npm run build` puis
# `node dist/index.js` ; passer par le runtime Node évite de construire une
# image et rend le déploiement lisible. Le Dockerfile reste valable pour qui
# préfère un conteneur.
#
# Mise en service : Render → New → Blueprint → ce dépôt. Les variables marquées
# `sync: false` ne sont PAS versionnées : Render les réclame au moment de la
# création, à renseigner dans son interface.

services:
  - type: web
    name: nadhef-soukra
    runtime: node
    # Francfort est la région la plus proche de la Tunisie.
    region: frankfurt
    plan: free
    branch: main
    # Un seul processus sert l'API et le client bâti (server/src/app.ts).
    #
    # `--include=dev` n'est pas superflu : npm lit NODE_ENV, et comme il vaut
    # `production` ci-dessous, un `npm ci` nu omettrait les devDependencies —
    # donc `tsc`, `vite` et `tailwindcss`, sans lesquels il n'y a pas de build.
    # Elles ne pèsent que sur l'image de build, pas sur l'exécution.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/dist/index.js
    # Render coupe une instance gratuite jugée morte : cette sonde l'en empêche
    # et sert de vérification de déploiement.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Secrets engendrés par Render, jamais vus par personne. Le serveur
      # refuse de démarrer en production s'ils gardent leur valeur de
      # développement (server/src/env.ts) — d'où la génération automatique.
      - key: PHONE_PEPPER
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      # --- Base libSQL / Turso ------------------------------------------------
      # OBLIGATOIRE. Sans elle, la base retombe sur un fichier local, et le
      # disque de Render est éphémère : tous les signalements disparaîtraient au
      # premier redéploiement.
      - key: DATABASE_URL          # libsql://…-<compte>.turso.io
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # --- Photos : stockage objet compatible S3 ------------------------------
      # Supabase Storage, Cloudflare R2, Backblaze B2 — au choix. Même raison
      # que la base : sans stockage externe, les preuves avant/après des
      # chantiers sont écrites sur le disque éphémère et perdues au
      # redéploiement. Si l'un de ces champs manque, le code retombe sur le
      # disque local (server/src/services/storage.ts) — acceptable pour un
      # test, pas en production.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE
        sync: false
      # `auto` ne vaut que pour R2 : ailleurs, la région doit être celle du
      # bucket, sinon la signature SigV4 est rejetée.
      - key: S3_REGION
        sync: false

      # --- Domaine ------------------------------------------------------------
      # Construit les URL de partage et les vignettes Open Graph
      # (server/src/services/partage.ts). À faire pointer sur le domaine
      # définitif une fois le DNS OVH en place ; l'URL .onrender.com convient
      # en attendant.
      - key: PUBLIC_BASE_URL
        sync: false
      # Restreindre au domaine servi. Le `*` du développement laisserait
      # n'importe quel site appeler l'API au nom d'un visiteur.
      - key: CORS_ORIGIN
        sync: false

      # Le seed de démonstration n'a rien à faire sur une instance réelle, où
      # les données sont celles des habitants.
      - key: SEED_ON_START
        value: "false"

      # --- Modérateur ---------------------------------------------------------
      # Indépendant du seed : au démarrage, si aucun compte `admin` n'existe,
      # ce numéro en devient un. Sans lui, personne ne pourrait jamais modérer,
      # aucune route ne permettant de promouvoir un compte après coup.
      # Mets TON numéro (format tunisien, 8 chiffres commençant par 2/4/5/9) :
      # c'est celui qui recevra le code de connexion.
      - key: SEED_ADMIN_PHONE
        sync: false
      - key: SEED_ADMIN_PSEUDO
        sync: false
